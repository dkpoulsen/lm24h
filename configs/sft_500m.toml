[model]
vocab_size = 32768
n_layer = 24
d_model = 1280
n_head = 20
n_kv_head = 5
head_dim = 64
ffn_dim = 3840
max_seq_len = 2048
rope_theta = 100000.0

[train]
run_name = "lm24h-500m-sft"
sft = true
init_from = "/lm24h/runs/lm24h-500m/ckpt/final.pt"
data_train = "/lm24h/data/sft/train"
data_val = "/lm24h/data/sft/val"
epochs = 1
seed = 4321
micro_batch = 16
grad_accum = 2            # global batch = 5*16*2 = 160 rows (~330k tok)
max_steps = 0             # derived from epochs
warmup_steps = 100
decay_frac = 0.9          # near-cosine-ish: long linear decay
lr = 1.0e-4
min_lr_ratio = 0.05
betas = [0.9, 0.95]
weight_decay = 0.0
grad_clip = 1.0
eval_every = 250
eval_batches = 12
ckpt_every = 500
keep_ckpts = 2
compile = true
