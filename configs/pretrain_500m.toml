[model]
vocab_size = 32768
n_layer = 24
d_model = 1280
n_head = 20
n_kv_head = 5
head_dim = 64
ffn_dim = 3840
max_seq_len = 2048
rope_theta = 100000.0

[train]
run_name = "lm24h-500m"
data_train = "/lm24h/data/tok/train_*.bin"
data_val = "/lm24h/data/tok/val_*.bin"
seed = 1234
micro_batch = 16          # per GPU, sequences of 2048
grad_accum = 6            # global batch = 5 GPUs * 16 * 6 * 2048 = 983,040 tokens
max_steps = 9200
warmup_steps = 400
decay_frac = 0.2          # WSD: linear decay to min_lr over last 20% of steps
lr = 8.0e-4
min_lr_ratio = 0.05
betas = [0.9, 0.95]
weight_decay = 0.1
grad_clip = 1.0
eval_every = 250
eval_batches = 24         # x micro_batch x world x 2048 tokens
ckpt_every = 400          # ~35-40 min
keep_ckpts = 3
compile = true
